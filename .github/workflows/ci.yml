name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test Edge Functions
        run: |
          deno fmt --check supabase/functions
          deno test supabase/functions/spotify-token-refresh/index_test.ts supabase/functions/delete-account/index_test.ts
      - name: Test and lint Android
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug bundleRelease lintRelease

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Test iOS
        working-directory: ios
        run: |
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test -project Wavepoint.xcodeproj -scheme Wavepoint -destination "platform=iOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO
      - name: Archive iOS without signing
        working-directory: ios
        run: xcodebuild archive -project Wavepoint.xcodeproj -scheme Wavepoint -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Wavepoint.xcarchive" CODE_SIGNING_ALLOWED=NO
