name: Wavepoint

options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.46.0
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk.git
    exactVersion: 5.0.1

settings:
  base:
    SWIFT_VERSION: 6.0

targets:
  Wavepoint:
    type: application
    platform: iOS
    sources:
      - path: Wavepoint
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    info:
      path: Wavepoint/Resources/Info.plist
      properties:
        CFBundleDisplayName: Wavepoint
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: ai.mapier.swipe
            CFBundleURLSchemes:
              - ai.mapier.swipe
        OAUTH_CALLBACK_URL: $(OAUTH_CALLBACK_URL)
        NSAppleMusicUsageDescription: Wavepoint uses your Apple Music library to play cleanup samples and create a Dumpster playlist for songs you choose to review.
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        SUPABASE_URL: $(SUPABASE_URL)
        SPOTIFY_APP_REMOTE_CALLBACK_URL: $(SPOTIFY_APP_REMOTE_CALLBACK_URL)
        SPOTIFY_CLIENT_ID: $(SPOTIFY_CLIENT_ID)
        LSApplicationQueriesSchemes:
          - spotify
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HV58968J2R
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: ai.mapier.swipe
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - package: Supabase
        product: Supabase
      - package: SpotifyiOS
        product: SpotifyiOS

  WavepointTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WavepointTests
    dependencies:
      - target: Wavepoint
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.mapier.swipe.tests

schemes:
  Wavepoint:
    build:
      targets:
        Wavepoint: all
        WavepointTests: [test]
    test:
      targets:
        - WavepointTests
