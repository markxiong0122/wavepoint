name: Wavepoint

options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.46.0

settings:
  base:
    SWIFT_VERSION: 6.0

targets:
  Wavepoint:
    type: application
    platform: iOS
    sources:
      - path: Wavepoint
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    info:
      path: Wavepoint/Resources/Info.plist
      properties:
        CFBundleDisplayName: Wavepoint
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: ai.mapier.swipe
            CFBundleURLSchemes:
              - ai.mapier.swipe
        OAUTH_CALLBACK_URL: $(OAUTH_CALLBACK_URL)
        SPOTIFY_CLIENT_ID: $(SPOTIFY_CLIENT_ID)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        SUPABASE_URL: $(SUPABASE_URL)
        UILaunchScreen: {}
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: ai.mapier.swipe
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - package: Supabase
        product: Supabase

  WavepointTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WavepointTests
    dependencies:
      - target: Wavepoint
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.mapier.swipe.tests

schemes:
  Wavepoint:
    build:
      targets:
        Wavepoint: all
        WavepointTests: [test]
    test:
      targets:
        - WavepointTests
